name: "MDBList"
guid: "cbca79d7-ecde-4030-833c-3862f3c3a737"
version: "1.0.0.4"
targetAbi: "10.11.0.0"
framework: "net9.0"
overview: "Two-way sync of watched status and ratings, plus collection sync, against MDBList"
description: >
  Syncs watched status and ratings two-way between Jellyfin and MDBList,
  and pushes library/collection membership to MDBList. Uses MDBList's
  incremental sync API (last_activities + journal) for cheap, cursor-based
  updates instead of full-library reconciliation on every run.
category: "General"
owner: "linaspurinis"
artifacts:
- "Jellyfin.Plugin.MDBList.dll"
changelog: >
  1.0.0.4: Fixes a build issue where the plugin was compiled against a
  newer Jellyfin ABI (10.11.11) than the declared minimum (10.11.0),
  causing installs to fail with "Status: NotSupported" on Jellyfin
  10.11.1 through 10.11.10.


  1.0.0.3: Fixes "Disconnect" always showing a failure alert even though
  it always succeeded. Updates the plugin catalog icon to a full-bleed
  16:9 image instead of a square logo that Jellyfin's plugin page was
  cropping.


  1.0.0.2: Fixes the plugin catalog icon's URL -- 1.0.0.1 published one
  with no host, which Jellyfin couldn't fetch at all.


  1.0.0.1: Fixes scheduled syncs, "Sync now", and live scrobbling only
  ever acting on the first linked user when multiple Jellyfin users each
  have their own MDBList account connected. Adds a plugin catalog icon.


  1.0.0.0: Initial release. Two-way sync of watched status and ratings,
  push-only collection sync, live playback scrobbling to MDBList's
  /scrobble endpoints, OAuth device-code authentication, incremental
  cursor-based pulls with automatic full-reconciliation fallback, a
  24h scheduled full sync plus a 15-minute activity-gated cheap poll,
  and a config page for connecting your account and choosing what to
  sync.
